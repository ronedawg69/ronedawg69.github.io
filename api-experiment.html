<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Cycle Signals — Project 01</title>
  <meta name="description" content="An experiment connecting weather, rest and the daily ride.">
  <style>
    :root { color-scheme: dark; --ink: #ece8dc; --muted: #aaa69a; --gold: #e8c46d; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-width: 320px;
      color: var(--ink);
      background: radial-gradient(ellipse at 68% 35%, rgba(198,158,49,.06), transparent 33rem), linear-gradient(180deg, #080808, #030303);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before { position: fixed; inset: 0; content: ""; pointer-events: none; background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.45) 120%); }
    .shell { position: relative; display: grid; grid-template-rows: auto 1fr auto; min-height: 100svh; width: min(1180px, calc(100% - 48px)); margin: auto; padding: 40px 0 36px; }
    .back { justify-self: start; color: var(--muted); font-size: 11px; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; transition: color .2s; }
    .back:hover { color: var(--gold); }
    .back:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; }
    .content { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr); align-items: center; gap: clamp(50px, 10vw, 150px); padding: 70px 6vw; }
    .eyebrow { margin: 0 0 16px; color: var(--gold); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; }
    h1 { max-width: 650px; margin: 0; font: 400 clamp(58px, 9vw, 118px)/.86 Georgia, "Times New Roman", serif; letter-spacing: -.065em; }
    .description { max-width: 450px; margin: 31px 0 0; color: var(--muted); font-size: 14px; line-height: 1.75; }
    .signal { position: relative; aspect-ratio: 3 / 4; max-height: 520px; border: 1px solid rgba(232,196,109,.2); background: #090908; }
    .signal::before { position: absolute; inset: 10px; content: ""; border: 1px solid rgba(255,255,255,.055); background: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 25% 20%; }
    .signal-line { position: absolute; top: 50%; left: 14%; right: 14%; height: 1px; background: var(--gold); box-shadow: 0 0 17px rgba(232,196,109,.35); transform: rotate(-12deg); }
    .signal-line::before, .signal-line::after { position: absolute; width: 7px; height: 7px; top: -3px; border-radius: 50%; content: ""; background: var(--gold); box-shadow: 0 0 15px rgba(232,196,109,.55); }
    .signal-line::before { left: 24%; } .signal-line::after { right: 17%; }
    .signal-label { position: absolute; bottom: 28px; left: 30px; color: #77746c; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    footer { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,.08); padding-top: 20px; color: #77746c; font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    @media (max-width: 760px) {
      .shell { width: calc(100% - 32px); padding-top: 28px; }
      .content { grid-template-columns: 1fr; gap: 48px; padding: 80px 0; }
      .signal { width: min(100%, 330px); justify-self: end; }
      footer span:last-child { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="projects.html">← Return to the rooms</a>
    <section class="content">
      <div>
        <p class="eyebrow">Project 01 · Experiment</p>
        <h1>Cycle<br>Signals</h1>
        <p class="description">A developing dashboard exploring the quiet connections between weather, sleep, activity and the daily ride to work.</p>
      </div>
      <div class="signal" aria-label="Abstract signal graph placeholder">
        <span class="signal-line" aria-hidden="true"></span>
        <span class="signal-label">Signal awaiting data</span>
      </div>
    </section>
    <footer><span>Room 01 / 16</span><span>Conceptual study · Work in progress</span></footer>
  </main>
</body>
</html>
