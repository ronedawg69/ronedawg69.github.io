<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A collection of experiments, ideas and things built while learning.">
  <title>Ronan's Project Rooms</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #050609;
      --ink: #101114;
      --paper: #eee9df;
      --muted: #9b968e;
      --gold: #d6b36a;
      --glow: rgba(237, 196, 105, 0.32);
      --line: rgba(238, 233, 223, 0.13);
    }

    * { box-sizing: border-box; }

    html { background: var(--night); }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--paper);
      background:
        radial-gradient(circle at 50% 35%, rgba(42, 45, 52, 0.3), transparent 38%),
        linear-gradient(145deg, #090a0e, #020305 70%);
      font-family: Georgia, "Times New Roman", serif;
    }

    button, a { font: inherit; }

    .entrance {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 72%, rgba(44, 50, 59, 0.42), transparent 42%),
        linear-gradient(#030407, #0a0d12 68%, #020304);
      transition: opacity 900ms ease, visibility 900ms ease;
    }

    .entrance::before {
      position: absolute;
      inset: 0;
      opacity: 0.14;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
      content: "";
      pointer-events: none;
    }

    .entrance__content {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 32px;
      animation: appear 1.8s both;
    }

    .entrance__eyebrow, .gallery__eyebrow {
      margin: 0;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .entrance-door {
      position: relative;
      width: clamp(128px, 15vw, 172px);
      aspect-ratio: 0.58;
      padding: 0;
      border: 1px solid rgba(232, 221, 198, 0.42);
      border-radius: 2px 2px 0 0;
      color: inherit;
      background: #111216;
      box-shadow: 0 28px 65px #000, 0 0 45px var(--glow);
      cursor: pointer;
      perspective: 900px;
    }

    .entrance-door::before {
      position: absolute;
      inset: -9px -10px -5px;
      z-index: -1;
      border: 2px solid #24262b;
      border-bottom: 0;
      content: "";
    }

    .entrance-door__light {
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 54%, rgba(255, 222, 145, 0.3));
    }

    .entrance-door__handle, .project-door__handle {
      position: absolute;
      top: 52%;
      right: 12%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px rgba(214, 179, 106, 0.6);
    }

    .entrance-door:hover { box-shadow: 0 28px 65px #000, 0 0 80px rgba(237, 196, 105, 0.46); }
    .entrance-door:hover .entrance-door__light { background: linear-gradient(100deg, transparent 35%, rgba(255, 222, 145, 0.42)); }

    .entrance__instruction {
      margin: 0;
      color: #c7c1b8;
      font-size: 0.9rem;
      font-style: italic;
      letter-spacing: 0.06em;
    }

    .gallery {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 72px 0 100px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 900ms 250ms ease, transform 900ms 250ms ease;
    }

    body.entered .entrance { visibility: hidden; opacity: 0; pointer-events: none; }
    body.entered .gallery { opacity: 1; transform: none; }

    .gallery__header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 54px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .gallery h1 {
      margin: 9px 0 0;
      font-size: clamp(2rem, 5vw, 4.6rem);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 0.95;
    }

    .gallery__note {
      max-width: 285px;
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .doors {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(28px, 5vw, 62px) clamp(18px, 4vw, 48px);
      counter-reset: room;
    }

    .room {
      counter-increment: room;
      display: grid;
      justify-items: center;
      gap: 15px;
      min-width: 0;
    }

    .project-door {
      position: relative;
      display: block;
      width: min(100%, 150px);
      aspect-ratio: 0.62;
      border: 1px solid #292a2e;
      border-radius: 2px 2px 0 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.025), transparent 20% 80%, rgba(0,0,0,.22)),
        #111216;
      box-shadow: 0 18px 30px rgba(0, 0, 0, 0.48);
      text-decoration: none;
      transition: border-color 240ms ease, box-shadow 240ms ease, transform 240ms ease;
    }

    .project-door::before {
      position: absolute;
      inset: 8% 11% 52%;
      border: 1px solid rgba(238, 233, 223, 0.06);
      content: "";
    }

    .project-door::after {
      position: absolute;
      inset: 52% 11% 8%;
      border: 1px solid rgba(238, 233, 223, 0.06);
      content: "";
    }

    .room__number {
      color: #65625d;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
    }

    .room__number::before { content: counter(room, decimal-leading-zero); }

    .room--active .project-door {
      border-color: rgba(214, 179, 106, 0.7);
      background:
        linear-gradient(115deg, rgba(244, 206, 123, 0.08), transparent 52%),
        #171512;
      box-shadow: 0 18px 34px #000, 0 0 38px rgba(214, 179, 106, 0.17);
    }

    .room--active .project-door:hover,
    .room--active .project-door:focus-visible {
      border-color: var(--gold);
      box-shadow: 0 22px 42px #000, 0 0 54px rgba(214, 179, 106, 0.28);
      outline: none;
      transform: translateY(-5px);
    }

    .room--active .room__number { color: var(--gold); }

    .project-door__title {
      position: absolute;
      right: 10px;
      bottom: 13px;
      left: 10px;
      z-index: 1;
      color: var(--paper);
      font-size: clamp(0.68rem, 1.3vw, 0.86rem);
      line-height: 1.2;
      text-align: center;
    }

    .project-door--locked { cursor: not-allowed; opacity: 0.52; }
    .project-door--locked .project-door__handle { background: #4a4947; box-shadow: none; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 700px) {
      .gallery { width: min(560px, calc(100% - 32px)); padding-top: 42px; }
      .gallery__header { display: block; margin-bottom: 38px; }
      .gallery__note { margin-top: 18px; }
      .doors { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="entrance" aria-labelledby="entrance-title">
      <div class="entrance__content">
        <p class="entrance__eyebrow" id="entrance-title">An archive of things made</p>
        <button class="entrance-door" id="enter-button" type="button" aria-label="Open the door to the project rooms">
          <span class="entrance-door__light" aria-hidden="true"></span>
          <span class="entrance-door__handle" aria-hidden="true"></span>
        </button>
        <p class="entrance__instruction">There is more on the other side.</p>
      </div>
    </section>

    <section class="gallery" id="project-gallery" aria-labelledby="gallery-title">
      <header class="gallery__header">
        <div>
          <p class="gallery__eyebrow">The project rooms</p>
          <h1 id="gallery-title">Choose a door.</h1>
        </div>
        <p class="gallery__note">One room is open. The others are waiting for whatever comes next.</p>
      </header>

      <div class="doors" aria-label="Projects">
        <article class="room room--active">
          <a class="project-door" href="api-experiment.html" aria-label="Open Cycle Signals, project 1">
            <span class="entrance-door__handle" aria-hidden="true"></span>
            <span class="project-door__title">Cycle Signals</span>
          </a>
          <span class="room__number" aria-label="Project 1"></span>
        </article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 2"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 3"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 4"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 5"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 6"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 7"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 8"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 9"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 10"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 11"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 12"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 13"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 14"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 15"></span></article>
        <article class="room"><span class="project-door project-door--locked" aria-hidden="true"><span class="project-door__handle"></span></span><span class="room__number" aria-label="Project 16"></span></article>
      </div>
    </section>
  </main>

  <script>
    const enterButton = document.querySelector("#enter-button");
    const projectGallery = document.querySelector("#project-gallery");

    enterButton.addEventListener("click", () => {
      document.body.classList.add("entered");
      window.setTimeout(() => projectGallery.querySelector("a").focus(), 950);
    });
  </script>
</body>
</html>
