<html data-type="html" data-identifier="b3604a7f-5ae1-4326-b7ec-18c05663e61d" data-title="Permanent Night at Bull Rock" data-version="6" width="1200" height="700"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bull Rock at Night</title>
  <style>
    :root {
      --sky-top: #010208;
      --sky-bottom: #0c1728;
      --rock: #020407;
      --sea-top: #02050a;
      --sea-bottom: #000102;
      --lantern: #fff2b0;
      --white: #f3f6f8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 600px;
      min-height: 500px;
      margin: 0;
      overflow: hidden;
      background: var(--sky-top);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
    }

    #opening-scene {
      position: fixed;
      inset: 0;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 84%, rgba(30, 46, 69, 0.36), transparent 52%),
        linear-gradient(180deg, var(--sky-top) 0%, #040914 52%, var(--sky-bottom) 100%);
      transition: opacity 700ms ease, visibility 700ms ease;
    }

    #star-field {
      position: absolute;
      inset: 0 0 24% 0;
      z-index: 1;
      width: 100%;
      height: 76%;
      pointer-events: none;
    }

    #bull-rock {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    #rock-silhouette,
    #left-stack,
    #right-stack,
    #lighthouse-building,
    #lighthouse-tower,
    #lighthouse-roof,
    #lighthouse-rail {
      fill: var(--rock);
    }

    #lighthouse-beam {
      fill: url(#beam-fade);
      opacity: 0.15;
      transform-box: view-box;
      transform-origin: 656px 225.5px;
      animation: rotate-beam 12s linear infinite;
      pointer-events: none;
    }

    #lantern-glow {
      fill: url(#lantern-glow-gradient);
      opacity: 0.72;
    }

    #lantern-room {
      fill: var(--lantern);
      filter: drop-shadow(0 0 2px rgba(255, 242, 176, 0.9));
    }

    #sea {
      position: absolute;
      z-index: 4;
      right: 0;
      bottom: 0;
      left: 0;
      height: 25%;
      background: linear-gradient(
        180deg,
        var(--sea-top) 0%,
        #010308 28%,
        var(--sea-bottom) 100%
      );
    }

    #sea::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 1px;
      background: rgba(116, 145, 169, 0.055);
    }

    #sea::after {
      content: "";
      position: absolute;
      top: 23%;
      left: 28%;
      width: 44%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(91, 113, 132, 0.025),
        transparent
      );
    }

    #enter-area {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: clamp(30px, 5vh, 52px);
      transform: translateX(-50%);
      animation: reveal-button 900ms ease both;
    }

    #enter-button {
      min-width: 118px;
      padding: 11px 25px;
      border: 1px solid rgba(243, 246, 248, 0.52);
      border-radius: 999px;
      color: var(--white);
      background: rgba(2, 5, 10, 0.3);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        color 180ms ease,
        background 180ms ease,
        border-color 180ms ease,
        transform 180ms ease;
    }

    #enter-button:hover {
      color: var(--rock);
      background: var(--white);
      border-color: var(--white);
      transform: translateY(-2px);
    }

    #enter-button:focus-visible {
      outline: 2px solid var(--lantern);
      outline-offset: 5px;
    }

    #project-content {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      visibility: hidden;
      opacity: 0;
      color: var(--white);
      background: var(--sky-top);
      transition: opacity 700ms ease;
    }

    #project-heading {
      margin: 0;
      font-size: clamp(25px, 4vw, 48px);
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    body.entered #opening-scene {
      visibility: hidden;
      opacity: 0;
    }

    body.entered #project-content {
      visibility: visible;
      opacity: 1;
    }

    @keyframes rotate-beam {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes reveal-button {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @media (max-width: 720px) {
      html,
      body {
        min-width: 0;
      }

      #bull-rock {
        left: -25%;
        width: 150%;
      }

      #sea {
        height: 27%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #lighthouse-beam {
        animation-duration: 30s;
      }

      #enter-area {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main id="opening-scene" aria-label="Bull Rock in West Cork beneath a permanent night sky">
    <canvas id="star-field" aria-hidden="true"></canvas>

    <svg id="bull-rock" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bull Rock silhouette with a rotating lighthouse light">
      <defs>
        <linearGradient id="beam-fade" gradientUnits="userSpaceOnUse" x1="656" y1="225.5" x2="1080" y2="225.5">
          <stop offset="0" stop-color="#fff2b0" stop-opacity="0.46"></stop>
          <stop offset="0.08" stop-color="#fff2b0" stop-opacity="0.22"></stop>
          <stop offset="0.52" stop-color="#fff2b0" stop-opacity="0.07"></stop>
          <stop offset="1" stop-color="#fff2b0" stop-opacity="0"></stop>
        </linearGradient>

        <radialGradient id="lantern-glow-gradient">
          <stop offset="0" stop-color="#fff8cf" stop-opacity="0.9"></stop>
          <stop offset="0.25" stop-color="#fff2b0" stop-opacity="0.35"></stop>
          <stop offset="1" stop-color="#fff2b0" stop-opacity="0"></stop>
        </radialGradient>
      </defs>

      <path id="lighthouse-beam" d="
        M656 225.5
        L1080 207
        Q1090 225.5 1080 244
        Z
      "></path>

      <path id="rock-silhouette" fill-rule="evenodd" d="
        M190 530
        L224 491
        L244 427
        L270 357
        L309 320
        L368 298
        L428 281
        L477 253
        L530 244
        L572 222
        L619 229
        L660 250
        L701 285
        L735 324
        L762 370
        L798 409
        L827 459
        L871 496
        L922 530
        Z

        M486 530
        C490 495 496 467 511 449
        C527 431 553 431 569 449
        C584 468 590 496 593 530
        Z
      "></path>

      <path id="left-stack" d="M66 530 L98 486 L130 466 L160 481 L181 515 L201 530 Z"></path>
      <path id="right-stack" d="M920 530 L958 510 L985 477 L1012 465 L1037 493 L1072 530 Z"></path>

      <g id="lighthouse">
        <path id="lighthouse-building" d="M630 247 H646 V258 H629 Z"></path>
        <path id="lighthouse-tower" d="M652 230 H660 L662 258 H650 Z"></path>
        <rect id="lighthouse-rail" x="649" y="227" width="14" height="1"></rect>
        <circle id="lantern-glow" cx="656" cy="225.5" r="15"></circle>
        <rect id="lantern-room" x="652" y="222" width="8" height="7" rx="0.6"></rect>
        <path id="lighthouse-roof" d="M651 222 L656 217 L661 222 Z"></path>
      </g>
    </svg>

    <div id="sea" aria-hidden="true"></div>

    <div id="enter-area">
      <button id="enter-button" type="button" aria-label="Enter the project">Enter</button>
    </div>
  </main>

  <section id="project-content" aria-hidden="true">
    <h1 id="project-heading">Your project begins here</h1>
  </section>

  <script>
    (() => {
      const canvas = document.getElementById("star-field");
      const context = canvas.getContext("2d");
      const enterButton = document.getElementById("enter-button");
      const projectContent = document.getElementById("project-content");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      const stars = [];
      let shootingStar = null;
      let nextShootingStar = performance.now() + randomBetween(14000, 30000);
      let previousTime = performance.now();
      let frameId = 0;

      function randomBetween(minimum, maximum) {
        return minimum + Math.random() * (maximum - minimum);
      }

      function gaussianRandom() {
        let first = 0;
        let second = 0;

        while (first === 0) {
          first = Math.random();
        }

        while (second === 0) {
          second = Math.random();
        }

        return Math.sqrt(-2 * Math.log(first)) * Math.cos(2 * Math.PI * second);
      }

      function resizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.max(1, Math.floor(bounds.width * pixelRatio));
        canvas.height = Math.max(1, Math.floor(bounds.height * pixelRatio));
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        createSky(bounds.width, bounds.height);
      }

      function addStar(x, y, radius, alpha, color, glow, flicker) {
        stars.push({
          x,
          y,
          radius,
          alpha,
          color,
          glow,
          flicker,
          phase: Math.random() * Math.PI * 2,
          speed: randomBetween(0.00008, 0.00022)
        });
      }

      function createSky(width, height) {
        stars.length = 0;

        const baseCount = Math.min(
          1250,
          Math.max(430, Math.floor((width * height) / 1050))
        );

        for (let index = 0; index < baseCount; index += 1) {
          const yRatio = Math.pow(Math.random(), 1.17);
          const sizeRoll = Math.random();
          const temperatureRoll = Math.random();

          let radius = randomBetween(0.16, 0.42);
          let alpha = randomBetween(0.22, 0.72);
          let color = "235, 241, 250";
          let glow = false;

          if (sizeRoll > 0.965) {
            radius = randomBetween(0.55, 0.88);
            alpha = randomBetween(0.58, 0.92);
          }

          if (sizeRoll > 0.997) {
            radius = randomBetween(1, 1.35);
            alpha = randomBetween(0.78, 0.98);
            glow = true;
          }

          if (temperatureRoll < 0.07) {
            color = "194, 216, 255";
          } else if (temperatureRoll > 0.91) {
            color = "255, 225, 188";
          } else if (temperatureRoll > 0.985) {
            color = "255, 197, 158";
          }

          addStar(
            Math.random() * width,
            yRatio * height * 0.98,
            radius,
            alpha * (1 - yRatio * 0.32),
            color,
            glow,
            sizeRoll > 0.97
          );
        }

        const bandStars = Math.floor(baseCount * 0.22);

        for (let index = 0; index < bandStars; index += 1) {
          const xRatio = Math.random();
          const bandCenter = height * (0.1 + xRatio * 0.5);
          const y = bandCenter + gaussianRandom() * height * 0.09;

          if (y < 0 || y > height * 0.88) {
            continue;
          }

          addStar(
            xRatio * width,
            y,
            randomBetween(0.12, 0.38),
            randomBetween(0.12, 0.48),
            Math.random() > 0.85 ? "213, 225, 255" : "232, 237, 245",
            false,
            false
          );
        }

        const prominentStars = [
          { x: 0.13, y: 0.18, radius: 1.45, color: "201, 221, 255" },
          { x: 0.29, y: 0.35, radius: 1.2, color: "255, 224, 184" },
          { x: 0.73, y: 0.2, radius: 1.55, color: "235, 242, 255" },
          { x: 0.86, y: 0.42, radius: 1.3, color: "255, 205, 165" }
        ];

        prominentStars.forEach((star) => {
          addStar(
            width * star.x,
            height * star.y,
            star.radius,
            0.94,
            star.color,
            true,
            true
          );
        });
      }

      function drawStar(star, time) {
        const variation =
          star.flicker && !reducedMotion.matches
            ? 0.97 + Math.sin(time * star.speed + star.phase) * 0.03
            : 1;

        const alpha = star.alpha * variation;

        if (star.glow) {
          const halo = context.createRadialGradient(
            star.x,
            star.y,
            0,
            star.x,
            star.y,
            star.radius * 4.5
          );

          halo.addColorStop(0, `rgba(${star.color}, ${alpha * 0.45})`);
          halo.addColorStop(0.3, `rgba(${star.color}, ${alpha * 0.14})`);
          halo.addColorStop(1, `rgba(${star.color}, 0)`);

          context.fillStyle = halo;
          context.beginPath();
          context.arc(star.x, star.y, star.radius * 4.5, 0, Math.PI * 2);
          context.fill();
        }

        context.fillStyle = `rgba(${star.color}, ${alpha})`;
        context.beginPath();
        context.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        context.fill();
      }

      function drawSky(time, width, height) {
        context.clearRect(0, 0, width, height);

        for (const star of stars) {
          drawStar(star, time);
        }
      }

      function createShootingStar(width, height) {
        const angle = randomBetween(0.4, 0.55);
        const speed = randomBetween(0.48, 0.62);

        shootingStar = {
          x: randomBetween(width * 0.12, width * 0.65),
          y: randomBetween(height * 0.08, height * 0.3),
          velocityX: Math.cos(angle) * speed,
          velocityY: Math.sin(angle) * speed,
          length: randomBetween(65, 105),
          age: 0,
          lifetime: randomBetween(500, 760)
        };
      }

      function drawShootingStar(delta) {
        if (!shootingStar) {
          return;
        }

        shootingStar.age += delta;
        shootingStar.x += shootingStar.velocityX * delta;
        shootingStar.y += shootingStar.velocityY * delta;

        const progress = shootingStar.age / shootingStar.lifetime;
        const opacity = Math.sin(Math.min(progress, 1) * Math.PI);
        const velocity = Math.hypot(
          shootingStar.velocityX,
          shootingStar.velocityY
        );

        const tailX =
          shootingStar.x -
          (shootingStar.velocityX / velocity) * shootingStar.length;
        const tailY =
          shootingStar.y -
          (shootingStar.velocityY / velocity) * shootingStar.length;

        const trail = context.createLinearGradient(
          tailX,
          tailY,
          shootingStar.x,
          shootingStar.y
        );

        trail.addColorStop(0, "rgba(220, 232, 250, 0)");
        trail.addColorStop(0.82, `rgba(232, 241, 255, ${opacity * 0.24})`);
        trail.addColorStop(1, `rgba(255, 255, 255, ${opacity * 0.9})`);

        context.strokeStyle = trail;
        context.lineWidth = 1;
        context.lineCap = "round";
        context.beginPath();
        context.moveTo(tailX, tailY);
        context.lineTo(shootingStar.x, shootingStar.y);
        context.stroke();

        if (shootingStar.age >= shootingStar.lifetime) {
          shootingStar = null;
          nextShootingStar = performance.now() + randomBetween(14000, 30000);
        }
      }

      function animate(time) {
        const bounds = canvas.getBoundingClientRect();
        const delta = Math.min(32, time - previousTime || 16);
        previousTime = time;

        drawSky(time, bounds.width, bounds.height);

        if (
          !reducedMotion.matches &&
          !shootingStar &&
          time >= nextShootingStar
        ) {
          createShootingStar(bounds.width, bounds.height);
        }

        if (!reducedMotion.matches) {
          drawShootingStar(delta);
        }

        frameId = requestAnimationFrame(animate);
      }

      function enterProject() {
        const enterEvent = new CustomEvent("bullrock:enter", {
          cancelable: true
        });

        if (!window.dispatchEvent(enterEvent)) {
          return;
        }

        document.body.classList.add("entered");
        projectContent.setAttribute("aria-hidden", "false");
      }

      enterButton.addEventListener("click", enterProject);
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("pagehide", () => {
        cancelAnimationFrame(frameId);
      });

      resizeCanvas();
      frameId = requestAnimationFrame(animate);
    })();
  </script>

</body></html>
